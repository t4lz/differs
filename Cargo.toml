[package]
name = "differs"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A Rust and Git aware diff command. Compare a single Rust item across files, modules and git refs."
repository = "https://github.com/t4lz/differs"
keywords = ["diff", "git", "rust-analyzer", "refactor", "review"]
categories = ["development-tools"]

[dependencies]
hol = { git = "https://github.com/t4lz/hol", features = ["git"] }
clap = { version = "4.5", features = ["derive"] }
git2 = "0.20"
tempfile = "3.22"